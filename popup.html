<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <style>
    :root[data-theme="dark"] {
      --bg-primary: #17181c;
      --bg-card: #26272e;
      --bg-card-hover: #2e3039;
      --text-primary: #e8e8eb;
      --text-secondary: #9ca0ab;
      --accent: #7c6df5;
      --accent-hover: #6b5ce6;
      --accent-glow: rgba(124, 109, 245, 0.18);
      --success: #34d399;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.4);
      --toggle-bg: #2a2b33;
      --toggle-knob: #e8e8eb;
    }

    :root[data-theme="light"] {
      --bg-primary: #f7f7f9;
      --bg-card: #eff0f4;
      --bg-card-hover: #e6e7ed;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7084;
      --accent: #6c5ce7;
      --accent-hover: #5a4bd1;
      --accent-glow: rgba(108, 92, 231, 0.12);
      --success: #10b981;
      --border: rgba(0, 0, 0, 0.07);
      --shadow: rgba(0, 0, 0, 0.06);
      --toggle-bg: #d8d9e0;
      --toggle-knob: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      padding: 24px;
      font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 .logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .theme-toggle {
      width: 48px;
      height: 26px;
      background: var(--toggle-bg);
      border-radius: 13px;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .theme-toggle .knob {
      width: 20px;
      height: 20px;
      background: var(--toggle-knob);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 3px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    [data-theme="light"] .theme-toggle .knob { transform: translateX(21px); }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), var(--border), transparent);
      margin: 4px 0 20px;
    }

    .control-group { margin-bottom: 18px; }

    .control-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-label span:first-child {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .seconds-input {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .seconds-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
    }

    .seconds-input input::-webkit-outer-spin-button,
    .seconds-input input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .seconds-input input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .seconds-input .unit {
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .preset-btn {
      padding: 8px 0;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .preset-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    #toggleBtn {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    #toggleBtn:hover {
      box-shadow: 0 6px 24px rgba(124, 109, 245, 0.35);
      transform: translateY(-1px);
    }

    #toggleBtn:active { transform: translateY(0); }

    #toggleBtn.running {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    #toggleBtn.running:hover { background: var(--accent-glow); }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: background 0.3s;
    }

    .status-bar.active .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-bar.active { color: var(--success); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <div class="logo">&#8635;</div>
      Auto Refresh
    </h1>
    <div class="theme-toggle" id="themeToggle">
      <div class="knob" id="themeIcon">&#9790;</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="control-group">
    <div class="control-label"><span>Refresh Interval</span></div>
    <div class="seconds-input">
      <input type="number" id="seconds" min="0.1" max="86400" step="0.1" value="1">
      <div class="unit">sec</div>
    </div>
  </div>

  <div class="control-group">
    <div class="control-label"><span>Presets</span></div>
    <div class="presets">
      <button class="preset-btn" data-sec="1">1s</button>
      <button class="preset-btn" data-sec="5">5s</button>
      <button class="preset-btn" data-sec="10">10s</button>
      <button class="preset-btn" data-sec="60">60s</button>
    </div>
  </div>

  <button id="toggleBtn">&#9654; Start Refresh</button>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="status">Stopped</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
